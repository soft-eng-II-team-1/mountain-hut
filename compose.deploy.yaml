services:
  db:
    image: postgres:16-alpine
    container_name: mountain_hut_deployment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.deploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.deploy}
    volumes:
      - deployment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    image: mountain-hut:deployment
    build:
      context: .
      dockerfile: Dockerfile.deploy
    container_name: mountain_hut_deployment_app
    restart: unless-stopped
    environment:
      PORT: 3000
      SERVE_FRONTEND: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.deploy}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.deploy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.deploy}?schema=public
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  deployment-postgres-data:
