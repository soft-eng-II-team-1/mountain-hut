services:
  postgres:
    image: postgres:16-alpine
    container_name: mountain_hut_db
    restart: always
    environment:
      POSTGRES_PASSWORD: Group01SE2
      POSTGRES_USER: MountainHutUser
      POSTGRES_DB: MountainHut
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: